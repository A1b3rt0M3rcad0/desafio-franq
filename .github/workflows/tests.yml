name: Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps \
            -e packages/core \
            -e packages/api \
            -e packages/runner \
            -e packages/ui

      - name: Install browser for UI tests
        run: python -m playwright install --with-deps chromium

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Build application image
        run: docker compose build migrations

      - name: Run migrations on fresh database
        run: docker compose run --rm migrations

      - name: Validate migrations are idempotent
        run: docker compose run --rm migrations

      - name: Check migration/model drift
        env:
          AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/desafio_franq
        run: python -m alembic -c packages/core/alembic.ini check

      - name: Run tests
        env:
          AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/desafio_franq
          RUN_POSTGRES_INTEGRATION_TESTS: "1"
          RUN_BROWSER_UI_TESTS: "1"
        run: python -m pytest -q

      - name: Stop services
        if: always()
        run: docker compose down -v
