name: Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Build migrations image
        run: docker compose build migrations

      - name: Run migrations on fresh database
        run: docker compose run --rm migrations

      - name: Validate migrations are idempotent
        run: docker compose run --rm migrations

      - name: Check migration/model drift
        run: |
          set -a
          source .env
          set +a
          python -m alembic check

      - name: Run tests
        run: |
          set -a
          source .env
          set +a
          RUN_POSTGRES_INTEGRATION_TESTS=1 python -m pytest -q

      - name: Stop services
        if: always()
        run: docker compose down -v
