[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-franq-runner"
version = "0.1.0"
description = "Independent agent execution process for the Franq challenge"
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["package.runner*"]
namespaces = true
